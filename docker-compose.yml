name: intellivault

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intellivault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intellivault}
      POSTGRES_DB: ${POSTGRES_DB:-intellivault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images want a single mount at /var/lib/postgresql
      # (data lands in a version subdirectory) — see docker-library/postgres#37.
      - pg_data:/var/lib/postgresql
      # Creates <POSTGRES_DB>_test on first init (see the script).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intellivault} -d ${POSTGRES_DB:-intellivault}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-intellivault}
      # Native vector index (db.index.vector.*) is built into 5.x core —
      # no plugins required.
      NEO4J_PLUGINS: "[]"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-intellivault} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # Disposable Neo4j for integration tests — Community edition allows only
  # one database ("neo4j"), so unlike Postgres (where initdb adds a *_test
  # database in the same instance) test isolation needs a separate
  # instance. Ephemeral: no volume, different ports. Start with
  # `docker compose --profile test up -d --wait neo4j-test`.
  neo4j-test:
    image: neo4j:5.26-community
    profiles: ["test"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_TEST_PASSWORD:-testpassword}
      NEO4J_PLUGINS: "[]"
    ports:
      - "${NEO4J_TEST_HTTP_PORT:-7475}:7474"
      - "${NEO4J_TEST_BOLT_PORT:-7688}:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_TEST_PASSWORD:-testpassword} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    # No volume: the queue is transient work-in-flight. Durable run state lives
    # in Postgres (agent_runs), so a Redis restart loses at most queued jobs.
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:version-20.4
    environment:
      PHOENIX_WORKING_DIR: /data
    ports:
      - "${PHOENIX_PORT:-6006}:6006"       # UI + OTLP/HTTP
      - "${PHOENIX_GRPC_PORT:-4317}:4317"  # OTLP/gRPC
    volumes:
      - phoenix_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:6006/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Phoenix is observability-only — the gateway runs fine without it, so
      # don't let a slow/unhealthy Phoenix block the stack coming up.
      phoenix:
        condition: service_started
    extra_hosts:
      # Ollama runs on the host (GPU), not in compose — see scripts/ollama-dev.
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-intellivault}:${POSTGRES_PASSWORD:-intellivault}@postgres:5432/${POSTGRES_DB:-intellivault}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-intellivault}
      REDIS_URL: redis://redis:6379/0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      AGENT_SEARCH_MCP_URL: http://search-mcp:8770/mcp
      AGENT_WIKIPEDIA_MCP_URL: http://wikipedia-mcp:8771/mcp
      TASKIQ_ADMIN_URL: ${TASKIQ_ADMIN_URL-http://taskiq-admin:3000}
      TASKIQ_ADMIN_TOKEN: ${TASKIQ_ADMIN_TOKEN:-devadmintoken-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-IntelliVault}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:3000}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Self-hosted metasearch — the agent's web-search backend, JSON API enabled
  # (see docker/searxng/settings.yml). Internal only; not exposed to the host.
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-devsecret-change-me}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./docker/searxng:/etc/searxng:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # MCP wrapper over SearXNG (streamable-HTTP at /mcp). The agent worker loads
  # its `search` tool from here. Setting MCP_HTTP_PORT switches the image off its
  # default stdio transport (which exits immediately with no stdin) onto HTTP.
  search-mcp:
    image: isokoliuk/mcp-searxng:2.1.0
    environment:
      SEARXNG_URL: http://searxng:8080
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8770"
    ports:
      - "${AGENT_SEARCH_MCP_PORT:-8770}:8770"
    depends_on:
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8770/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Wikipedia MCP — authoritative entity summaries + related topics, used by the
  # agent's `lookup` node. Official Docker MCP image, no API key.
  wikipedia-mcp:
    image: mcp/wikipedia-mcp:latest
    command:
      - "--transport"
      - "streamable-http"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8771"
      - "--path"
      - "/mcp"
      - "--enable-cache"
    ports:
      - "${AGENT_WIKIPEDIA_MCP_PORT:-8771}:8771"

  # taskiq-admin — a web dashboard for the agent job queue (queued / started /
  # finished / errored, args, tracebacks, durations). The broker only reports to
  # it when TASKIQ_ADMIN_URL is set on backend + agent-worker (below). Its own
  # SQLite store lives in a volume; Postgres `agent_runs` stays the source of
  # truth for run state.
  taskiq-admin:
    image: ghcr.io/taskiq-python/taskiq-admin:latest
    environment:
      TASKIQ_ADMIN_API_TOKEN: ${TASKIQ_ADMIN_TOKEN:-devadmintoken-change-me}
      TASKIQ_ADMIN_DB_DRIVER: sqlite
      TASKIQ_ADMIN_DB_FILE_PATH: /usr/database/taskiq-admin.db
    volumes:
      - taskiq_admin_data:/usr/database
    ports:
      # 3000 is the frontend — the dashboard gets 3300 by default.
      - "${TASKIQ_ADMIN_PORT:-3300}:3000"
    restart: unless-stopped

  # The agent loop worker — a separate process, not in the request path.
  # `taskiq worker` pulls jobs off the Redis queue and runs the LangGraph.
  agent-worker:
    build: ./backend
    restart: unless-stopped  # its startup dials search-mcp; retry until it's ready
    command:
      - taskiq
      - worker
      - app.agent.broker:broker
      - app.agent.tasks
      - --workers
      - "1"
      - --max-async-tasks
      - "${AGENT_WORKER_CONCURRENCY:-4}"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      search-mcp:
        condition: service_healthy
      wikipedia-mcp:
        condition: service_started
      taskiq-admin:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-intellivault}:${POSTGRES_PASSWORD:-intellivault}@postgres:5432/${POSTGRES_DB:-intellivault}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-intellivault}
      REDIS_URL: redis://redis:6379/0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      AGENT_SEARCH_MCP_URL: http://search-mcp:8770/mcp
      AGENT_WIKIPEDIA_MCP_URL: http://wikipedia-mcp:8771/mcp
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-4}
      TASKIQ_ADMIN_URL: ${TASKIQ_ADMIN_URL-http://taskiq-admin:3000}
      TASKIQ_ADMIN_TOKEN: ${TASKIQ_ADMIN_TOKEN:-devadmintoken-change-me}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:${BACKEND_PORT:-8000}}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Server-side render reaches the backend on the compose network.
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/api/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot migration runner: `docker compose run --rm migrate`. Applying
  # migrations is a deliberate step — nothing runs them automatically.
  migrate:
    build: ./backend
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-intellivault}:${POSTGRES_PASSWORD:-intellivault}@postgres:5432/${POSTGRES_DB:-intellivault}
    command: ["yoyo", "apply", "--batch", "--database", "postgresql://${POSTGRES_USER:-intellivault}:${POSTGRES_PASSWORD:-intellivault}@postgres:5432/${POSTGRES_DB:-intellivault}", "migrations"]

  # One-shot Neo4j graph-migration runner: `docker compose run --rm graph-migrate`.
  # Neo4j has no yoyo equivalent — see backend/app/graph/migrations.py. Like
  # `migrate`, applying graph schema is a deliberate step.
  graph-migrate:
    build: ./backend
    profiles: ["tools"]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-intellivault}
    command: ["python", "scripts/graph_migrate.py", "apply"]

volumes:
  pg_data:
  neo4j_data:
  neo4j_logs:
  phoenix_data:
  taskiq_admin_data:
