name: intellivault

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intellivault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intellivault}
      POSTGRES_DB: ${POSTGRES_DB:-intellivault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images want a single mount at /var/lib/postgresql
      # (data lands in a version subdirectory) — see docker-library/postgres#37.
      - pg_data:/var/lib/postgresql
      # Creates <POSTGRES_DB>_test on first init (see the script).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intellivault} -d ${POSTGRES_DB:-intellivault}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-intellivault}
      # Native vector index (db.index.vector.*) is built into 5.x core —
      # no plugins required.
      NEO4J_PLUGINS: "[]"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-intellivault} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # Disposable Neo4j for integration tests — Community edition allows only
  # one database ("neo4j"), so unlike Postgres (where initdb adds a *_test
  # database in the same instance) test isolation needs a separate
  # instance. Ephemeral: no volume, different ports. Start with
  # `docker compose --profile test up -d --wait neo4j-test`.
  neo4j-test:
    image: neo4j:5.26-community
    profiles: ["test"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_TEST_PASSWORD:-testpassword}
      NEO4J_PLUGINS: "[]"
    ports:
      - "${NEO4J_TEST_HTTP_PORT:-7475}:7474"
      - "${NEO4J_TEST_BOLT_PORT:-7688}:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_TEST_PASSWORD:-testpassword} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  phoenix:
    image: arizephoenix/phoenix:version-20.4
    environment:
      PHOENIX_WORKING_DIR: /data
    ports:
      - "${PHOENIX_PORT:-6006}:6006"       # UI + OTLP/HTTP
      - "${PHOENIX_GRPC_PORT:-4317}:4317"  # OTLP/gRPC
    volumes:
      - phoenix_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:6006/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      # Phoenix is observability-only — the gateway runs fine without it, so
      # don't let a slow/unhealthy Phoenix block the stack coming up.
      phoenix:
        condition: service_started
    extra_hosts:
      # Ollama runs on the host (GPU), not in compose — see scripts/ollama-dev.
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-intellivault}:${POSTGRES_PASSWORD:-intellivault}@postgres:5432/${POSTGRES_DB:-intellivault}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-intellivault}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-IntelliVault}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:3000}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:${BACKEND_PORT:-8000}}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Server-side render reaches the backend on the compose network.
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/api/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot migration runner: `docker compose run --rm migrate`. Applying
  # migrations is a deliberate step — nothing runs them automatically.
  migrate:
    build: ./backend
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-intellivault}:${POSTGRES_PASSWORD:-intellivault}@postgres:5432/${POSTGRES_DB:-intellivault}
    command: ["yoyo", "apply", "--batch", "--database", "postgresql://${POSTGRES_USER:-intellivault}:${POSTGRES_PASSWORD:-intellivault}@postgres:5432/${POSTGRES_DB:-intellivault}", "migrations"]

volumes:
  pg_data:
  neo4j_data:
  neo4j_logs:
  phoenix_data:
