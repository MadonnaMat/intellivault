[project]
name = "intellivault-backend"
version = "0.1.0"
description = "IntelliVault FastAPI gateway"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "radon>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "SIM"]
mccabe.max-complexity = 10

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"
