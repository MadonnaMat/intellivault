name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.7"
          enable-cache: true

      - run: uv sync --frozen

      - name: Lint, types, complexity
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run radon cc app --min C --total-average

      - name: Start Postgres + Neo4j and prepare the test databases
        working-directory: .
        run: |
          cp .env.example .env
          docker compose --profile test up -d --wait postgres neo4j-test
          uv --project backend run yoyo apply --batch \
            --database "$TEST_DATABASE_URL" backend/migrations
        env:
          TEST_DATABASE_URL: postgresql://intellivault:intellivault@localhost:5432/intellivault_test

      - name: Tests
        run: uv run pytest
        env:
          # The graph integration tests hit the disposable neo4j-test instance;
          # they self-skip if it isn't reachable, so make sure it is.
          NEO4J_TEST_URI: bolt://localhost:7688
          NEO4J_TEST_PASSWORD: testpassword

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.7"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: "10.18.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Fail if the committed OpenAPI schema / TS types are stale
        run: make check-api-types

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.18.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.18.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Bring the stack up
        run: |
          cp .env.example .env
          docker compose build backend frontend migrate graph-migrate
          docker compose up -d --wait postgres neo4j phoenix
          docker compose run --rm migrate
          docker compose run --rm graph-migrate
          docker compose up -d --wait backend frontend

      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      - name: Run the end-to-end suite
        run: pnpm e2e
        working-directory: frontend

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
